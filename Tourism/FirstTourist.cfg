// Contract for sending the very first tourist into space.
//   Author: nightingale

CONTRACT_TYPE
{
    name = Tourism_FirstTourist
    group = Tourism

    sortKey = 00.FirstTourist

    title = Iniciar turismo espacial
    description = Recebemos uma oportunidade interessante. Millionnaire Tito Kerman sonha em ir para o espaço. Ao contrário da maioria dos Kerbals que simplesmente aparecem no complexo de astronautas, Tito está disposto a pagar seu caminho para o espaço. Uma nova corporação foi criada para turistas espaciais, tudo o que temos que fazer é trazer um Kerbal extra para o espaço por 4 horas. Íamos para lá de qualquer maneira...
    synopsis = Ajudar Tito Kerman a visitar o espaço.
    completedMessage = Os fundos de Tito serão muito bem gastos!

    // Level 2 prestige
    prestige = Significant

    targetBody = HomeWorld()

    agent = Kerbal Space Tourism

    // Can only do this contract once
    maxCompletions = 1

    // Contract rewards
    rewardFunds = 80000.0
    rewardReputation = 1.0
    failureReputation = 20.0

    PARAMETER
    {
        name = VesselParameterGroup
        type = VesselParameterGroup

        duration = 4h

        PARAMETER
        {
            name = HasCrew
            type = HasCrew

            trait = Pilot
        }

        PARAMETER
        {
            name = HasPassengers
            type = HasPassengers
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit

            minPeA = @/targetBody.AtmosphereAltitude() + 5000
        }
    }

    PARAMETER
    {
        name = RecoverKerbal
        type = RecoverKerbal

        completeInSequence = true
    }

    BEHAVIOUR
    {
        name = SpawnPassengers
        type = SpawnPassengers

        kerbal = NewKerbal(Male, "Tito Kerman")
    }

    BEHAVIOUR
    {
        name = Expression
        type = Expression

        CONTRACT_COMPLETED_SUCCESS
        {
            TouristCount = 1
            TouristLowOrbitCount = 1
        }
    }

    REQUIREMENT
    {
        name = Orbit
        type = Orbit
    }

    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract

        contractType = TourismContract
        invertRequirement = true

        title = Must not have completed a standard tourism contract
    }
}
